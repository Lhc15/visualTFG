<app-header></app-header>

<div class="container">
  <div class="content">
    <div class="layout">
      <!-- Contenedor del avatar (3D) a la izquierda -->
      <div
        class="image-container"
        id="avatar-element"
        [ngClass]="{ 'libre-half-width': showWebcam }"
      >
        <!-- Canvas con la animación -->
        <app-canvas [animationUrls]="animaciones" (animationEnded)="onAnimationEnded()"></app-canvas>
        <app-tool-menu
          [isPlaying]="isPlaying"
          [isLooping]="isLooping"
          [showWebcam]="false"           
          [disabled]="cargandoPregunta"   
          (playClicked)="onPlayClicked()"
          (loopToggled)="handleLoop($event)"
          [currentPlaybackRate]="currentPlaybackRate"
          (rateChange)="setPlaybackRate($event)"
          [webcamDisabled]="true"
          (webcamToggled)="null">        
        </app-tool-menu>
        
      </div>

      <!-- Contenedor de la cámara, se muestra solo si showWebcam es true -->
      <div class="camera-container" *ngIf="showWebcam">
        <video #videoElement class="mirror-video" autoplay></video>
      </div>

      <!-- Panel derecho con las opciones de examen -->
      <div class="right-panel" *ngIf="!showWebcam">
        <!-- Iconos de perfil, ajustes, logout -->
        <div class="icon-menu-fixed">
          <a (click)="volverAModos()" title="Modos">
            <i class="fa-solid fa-home"></i>
          </a>
          <a (click)="navigateTo('perfil')" title="Mi Perfil" class="user-icon">
            <i class="fa-solid fa-user"></i>
          </a>

          <a (click)="logout()" title="Cerrar Sesión" class="logout-icon">
            <i class="fa-solid fa-right-from-bracket"></i>
          </a>
        </div>

        <div *ngIf="!examFinished">
          <!-- Título del modo examen -->
          <h2 class="exam-title">
            <i class="fa-solid fa-bolt" style="margin-right: 2px"></i>
            ¡PONTE A PRUEBA!
          </h2>
          <!-- Nuevo enunciado general debajo del título -->
          <p class="enunciado-general">¿Qué ha dicho el avatar?</p>

          <!-- Mensaje de carga (se mantiene en esta posición) -->
          <div *ngIf="cargandoPregunta">Cargando pregunta...</div>

          <!-- Opciones de respuesta (4) -->
          <div class="word-list" *ngIf="opciones && !cargandoPregunta">
            <div
              class="word-item"
              *ngFor="let opcion of opciones"
              (click)="seleccionarOpcion(opcion._id)"
              [ngClass]="{
                'correct-answer': optionStatus[opcion._id] === 'correct',
                'wrong-answer': optionStatus[opcion._id] === 'incorrect',
                'correct-solution': respuestaCorrectaId === opcion._id
              }"
            >
              {{ opcion.palabra }}
              <!-- <i
                *ngIf="respuestaCorrectaId === opcion._id"
                class="fa-solid fa-check"
                style="margin-left: 8px; color: #4caf50"
              ></i> -->
            </div>
          </div>

          <!-- Botón manual: solo aparece tras responder la pregunta -->
          <div
            *ngIf="answeredThisQuestion && questionCount < maxQuestions"
            class="text-center mt-4"
          >
            <button class="small-webcam-btn" (click)="cargarNuevaPregunta()">
              Siguiente pregunta
            </button>
          </div>

          <!-- Mostrar resultados si ya contestaste la última -->
          <div
            *ngIf="answeredThisQuestion && readyToShowResults"
            class="text-center mt-4"
          >
            <button class="small-webcam-btn" (click)="mostrarResultados()">
              🎉 Mostrar resultados
            </button>
          </div>

          <!-- Bloque de feedback: se muestra debajo del botón de "Nueva Pregunta" -->
          <div
            *ngIf="resultado"
            class="resultado"
            [ngClass]="{
              'resultado-correcto': resultado === '¡Respuesta correcta!',
              'resultado-incorrecto': resultado === 'Respuesta incorrecta'
            }"
          >
            <p>
              <i
                *ngIf="resultado === '¡Respuesta correcta!'"
                class="fa-solid fa-circle-check icon-correct"
              ></i>
              <i
                *ngIf="resultado === 'Respuesta incorrecta'"
                class="fa-solid fa-circle-xmark icon-incorrect"
              ></i>
              {{ resultado }}
            </p>
          </div>
        </div>

        <div *ngIf="examFinished" class="exam-summary">
          <h3><i class="fa-solid fa-trophy"></i>  ¡Examen completado!</h3>
          <p>Has respondido {{ maxQuestions }} preguntas:</p>

          <!-- Línea de iconos: verde para acierto, rojo para fallo -->
          <div class="summary-icons">
            <ng-container *ngFor="let ok of resultsHistory; let i = index">
              <i
                class="fa"
                [ngClass]="
                  ok
                    ? 'fa-check-circle icon-correct'
                    : 'fa-times-circle icon-incorrect'
                "
              ></i>
            </ng-container>
          </div>

          <p class="mt-3">
            <strong>Aciertos:</strong> {{ correctCount }}
            &nbsp;|&nbsp;
            <strong>Fallos:</strong> {{ incorrectCount }}
          </p>

          <div class="mt-4">
            <button class="small-webcam-btn" (click)="startExamSession()">
              <i class="fa-solid fa-rotate-right"></i> Volver a empezar
            </button>
            <button class="small-webcam-btn" (click)="volverAModos()">
              <i class="fa-solid fa-house"></i> Salir
            </button>
          </div>
        </div>
      </div>
      <!-- fin right-panel -->
    </div>
    <!-- fin layout -->
  </div>
  <!-- fin content -->
</div>
<!-- fin container -->
