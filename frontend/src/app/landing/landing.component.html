<div class="landing-split">

  <!-- ── IZQUIERDA — AVATAR ── -->
  <div class="side-left" id="sideLeft" #sideLeft>

    <!-- Letras LSE flotantes -->
    <div class="lse-bg" id="lseBg"></div>

    <!-- Glow -->
    <div class="avatar-glow"></div>

    <!-- Logo -->
    <div class="logo-over">Visual Voices</div>

    <!-- Avatar con parallax -->
    <div class="avatar-parallax" id="avatarParallax">
      <div class="canvas-wrap">
        <app-canvas #canvas [standalone]="true" (animationEnded)="onHelloEnded()" ></app-canvas>
      </div>
    </div>

    <!-- Subtítulo signado -->
    <div class="signing-caption">signando: bienvenido</div>

  </div>

  <!-- ── DERECHA — CONTENIDO ── -->
  <div class="side-right">

    <p class="eyebrow reveal reveal-1">Lengua de Signos Española</p>

    <h1 class="headline reveal reveal-2">
      Aprende LSE<br>
      con un avatar<br>
      <em>que te habla</em>
    </h1>

    <p class="subline reveal reveal-3">
      Un avatar 3D interactivo te enseña a tu ritmo,
      desde el abecedario hasta conversaciones reales.
    </p>

    <div class="form-block reveal reveal-4">

      <!-- Tabs -->
      <div class="tabs-row">
        <button
          class="tab"
          [class.active]="isRegisterVisible"
          (click)="showRegister()"
        >Registrarse</button>
        <button
          class="tab"
          [class.active]="!isRegisterVisible"
          (click)="showLogin()"
        >Iniciar sesión</button>
      </div>

      <!-- Formularios -->
      <div class="tab-content">
        <app-registro *ngIf="isRegisterVisible"></app-registro>
        <app-login    *ngIf="!isRegisterVisible"></app-login>
      </div>

    </div>

    <!-- Stats -->
    <div class="stats reveal reveal-5">
      <div class="stat-item">
        <span class="stat-num">+100</span>
        <span class="stat-label">Signos</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">A1–B1</span>
        <span class="stat-label">Niveles CEFR</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">3D</span>
        <span class="stat-label">Avatar interactivo</span>
      </div>
    </div>

  </div>

</div>
