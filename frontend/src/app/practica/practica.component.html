<div class="prac-page">

  <div class="prac-topnav">
    <button class="prac-back" (click)="volver()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Inicio
    </button>
    <div class="prac-breadcrumb">Practica</div>
    <div class="prac-streak">
      <div class="prac-streak-dot"></div>
      <span>5 días de racha</span>
    </div>
  </div>

  <div class="prac-center">
    <div class="prac-panel">

      <div class="prac-left">

        <!-- Tarjeta de identificacion: card verde + panel de stats que emerge por detras -->
        <div class="prac-id-card">

          <!-- Card verde con avatar sobresaliendo (sin cambios) -->
          <div class="prac-prog-wrap">
            <!-- Canvas fuera del card, desbordando por arriba -->
            <div class="prac-canvas-wrap" #canvasWrap>
              <app-canvas [cameraZ]="4.3"></app-canvas>
            </div>
            <div class="prac-prog-card">
              <div class="prac-prog-content">
                <div class="prac-prog-eyebrow">Tu progreso actual</div>
                <div class="prac-prog-val">35%</div>
                <div class="prac-prog-sub">42 de 120 signos · nivel A1</div>
                <div class="prac-prog-bar"><div class="prac-prog-fill"></div></div>
              </div>
            </div>
          </div>

          <!-- Panel que nace desde detras del card verde -->
          <div class="prac-id-back">
            <div class="prac-stats-mini">
              <div class="prac-stat sm1">
                <div class="prac-stat-val">78%</div>
                <div class="prac-stat-label">Aciertos</div>
              </div>
              <div class="prac-stat sm2">
                <div class="prac-stat-val">12</div>
                <div class="prac-stat-label">Ejercicios</div>
              </div>
              <div class="prac-stat sm3">
                <div class="prac-stat-val">2h</div>
                <div class="prac-stat-label">Practicado</div>
              </div>
            </div>
          </div>

        </div>

      </div>

      <div class="prac-right">
        <div class="prac-right-title">Elige qué quieres practicar hoy</div>
        <!-- Wrapper exterior para que el punto de notificacion pueda sobresalir del item -->
        <div
          class="prac-ac-wrap"
          *ngFor="let s of secciones"
          [class.activo]="activoId === s.id"
          (mouseenter)="activar(s.id)"
          (mouseleave)="desactivar()">
          <!-- Punto de notificacion sobresaliente — fuera del item para no ser recortado -->
          <div class="prac-ac-notif-dot" *ngIf="s.novedad"></div>
          <div class="prac-ac-item" (click)="irA(s.id)">
            <div class="prac-ac-deco">{{ s.deco }}</div>
            <div class="prac-ac-expanded">
              <div class="prac-ac-pct">{{ s.progreso }}%</div>
              <div class="prac-ac-sub">{{ s.subtitulo }}</div>
              <div class="prac-ac-bar-wrap">
                <div class="prac-ac-bar"><div class="prac-ac-bar-fill" [style.width.%]="s.progreso"></div></div>
                <div class="prac-ac-bar-label">{{ s.progreso }}% completado</div>
              </div>
              <div class="prac-ac-novedad" *ngIf="s.novedad">
                <div class="prac-ac-novedad-dot"></div>
                {{ s.novedad }}
              </div>
              <div class="prac-ac-cta">
                Ir a practicar
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
            <div class="prac-ac-collapsed">
              <div class="prac-ac-name">{{ s.nombre }}</div>
              <div class="prac-ac-pct-small">{{ s.progreso }}%</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
