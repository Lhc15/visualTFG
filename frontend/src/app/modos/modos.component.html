<div class="modos-wrapper">

  <div class="category-subtitle" [class.visible]="hoveredCategory">
    <span>{{ hoveredCategory }}</span>
  </div>

  <div class="avatar-zone">
    <div class="avatar-glow"></div>
    <div class="avatar-canvas-wrap">
      <app-canvas [animationUrls]="currentAnimationUrls"></app-canvas>
    </div>
  </div>

  <div
    class="category-card arc-card arc-1"
    [class.active]="hoveredCategory === 'Abecedario'"
    (mouseenter)="onHover('abecedario')"
    (mouseleave)="onLeave()"
    (click)="navigateTo('/abecedario')"
  >
    <div class="img-area"></div>
    <div class="body">
      <h3>Abecedario</h3>
      <p>Aprende a deletrear en LSE letra a letra</p>
    </div>
    <div class="card-fill"></div>
  </div>

  <div
    class="category-card arc-card arc-2"
    [class.active]="hoveredCategory === 'Vocabulario'"
    (mouseenter)="onHover('vocabulario')"
    (mouseleave)="onLeave()"
    (click)="navigateTo('/libre')"
  >
    <div class="img-area"></div>
    <div class="body">
      <h3>Vocabulario</h3>
      <p>Explora y practica palabras del día a día</p>
    </div>
    <div class="card-fill"></div>
  </div>

  <div
    class="category-card arc-card arc-3"
    [class.active]="hoveredCategory === 'Gramática'"
    (mouseenter)="onHover('gramatica')"
    (mouseleave)="onLeave()"
    (click)="navigateTo('/guiado')"
  >
    <div class="img-area"></div>
    <div class="body">
      <h3>Gramática</h3>
      <p>Estructura y reglas de la LSE paso a paso</p>
    </div>
    <div class="card-fill"></div>
  </div>

  <div
    class="category-card arc-card arc-4"
    [class.active]="hoveredCategory === '¿Conversamos?'"
    (mouseenter)="onHover('conversamos')"
    (mouseleave)="onLeave()"
    (click)="navigateTo('/conversamos')"
  >
    <div class="img-area"></div>
    <div class="body">
      <h3>¿Conversamos?</h3>
      <p>Practica conversaciones reales en LSE</p>
    </div>
    <div class="card-fill"></div>
  </div>

</div>
