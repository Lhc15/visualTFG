<div class="vv-layout">

  <app-header></app-header>

  <!-- SPLIT -->
  <div class="vv-split">

    <!-- AVATAR PANEL -->
    <div class="vv-avatar-panel" #avatarPanel>
      <div class="vv-avatar-glow"></div>
      <div class="vv-canvas-wrap">
        <app-canvas #mainCanvas [cameraZ]="4.3"></app-canvas>
      </div>
    </div>

    <!-- ACTION PANEL -->
    <div class="vv-action-panel">
      <div class="vv-panel-nav">
        <span class="vv-pnav-back" (click)="volver()">Practica
        </span>
        <span class="vv-pnav-sep">›</span>
        <span class="vv-pnav-cur">Abecedario</span>
      </div>
      <div class="vv-action-scroll">

        <div class="vv-section-label">Abecedario · LSE</div>
        <div class="vv-title">Elige un <em>modo</em><br>para practicar</div>

        <div class="vv-mode-cards">

          <div class="vv-mode-card vv-mode-a" (click)="irAModo('modo-a')">
            <div class="vv-mode-eyebrow">Modo A</div>
            <div class="vv-mode-num">01</div>
            <div class="vv-mode-title">Adivina<br>la letra</div>
            <div class="vv-mode-desc">El avatar signa — tú eliges entre 4 opciones.</div>
            <div class="vv-mode-go">Empezar →</div>
          </div>

          <div class="vv-mode-card vv-mode-b" (click)="irAModo('modo-b')">
            <div class="vv-mode-eyebrow">Modo B</div>
            <div class="vv-mode-num">02</div>
            <div class="vv-mode-title">Encuentra<br>el signo</div>
            <div class="vv-mode-desc">4 avatares — ¿cuál está signando la letra correcta?</div>
            <div class="vv-mode-go">Empezar →</div>
          </div>

        </div>

      </div>
    </div>

  </div>
</div>
