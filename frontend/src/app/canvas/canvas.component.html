<div class="canvas-container">
  <div class="canvas-wrapper">
    <canvas #threeCanvas class="webgl" [class.invisible]="skinRunning"></canvas>

    <canvas
      #skinCanvas
      class="webgl skin-canvas"
      [class.invisible]="!skinRunning"
    ></canvas>

    <!-- Overlay de vídeo para demo: sustituye animación 3D cuando existe el mp4 -->
    <video
      #videoOverlay
      [class]="'video-overlay' + (compacto ? ' video-overlay--compacto' : '')"
      playsinline
      muted
      [style.opacity]="videoVisible ? 1 : 0"
    ></video>
  </div>

  <div class="button-container">
    <button *ngIf="!router.url.includes('landing')" (click)="resetView()" class="bottom-button">
      <i class="fas fa-undo"></i>
    </button>
  </div>
</div>
