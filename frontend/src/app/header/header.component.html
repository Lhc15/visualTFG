<header class="vv-global-header">
  <span class="vv-global-logo" (click)="irA('/modos2')">
    <span class="lg-negro">Visual</span><span class="lg-azul">V</span><span class="lg-amarillo">oi</span><span class="lg-verde">c</span><span class="lg-lila">es</span>
  </span>

  <nav class="vv-global-nav">
    <a routerLink="/modos2">Inicio</a>
  </nav>

  <!-- Avatar con menú desplegable -->
  <div class="vv-avatar-wrap" (click)="toggleMenu()" (clickOutside)="cerrarMenu()">
    <button class="vv-global-avatar">{{ inicialesUsuario }}</button>
    <div class="vv-avatar-menu" *ngIf="menuAbierto">
      <button class="vv-menu-item vv-menu-item--danger" (click)="cerrarSesion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </div>
</header>
